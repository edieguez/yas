# Type of segments to skip
# https://wiki.sponsor.ajay.app/w/Types
categories=sponsor,selfpromo,interaction,intro,outro,preview,hook,filler

# How to act on a segment: skip = seek past it, mute = mute audio for its
# duration and restore the previous mute state afterwards
# https://wiki.sponsor.ajay.app/w/Types#Action_types
action_types=skip,mute

# Skip a segment only the first time playback enters it; seeking back into
# it afterwards plays it
skip_once=yes

# Categories that show a "press to skip" prompt instead of being skipped
# automatically (comma-separated), e.g. filler,preview
manual_skip_categories=

# Key that skips in a manual prompt, undoes the last skip and jumps to a
# highlight when offered. It is only bound while one of those is offered.
skip_key=ENTER

# Seconds after a skip during which skip_key undoes it (0 disables undo)
unskip_window=5

# Vote on the segment under the playhead, or the last one skipped
upvote_key=Ctrl+g
downvote_key=Ctrl+b

# Highlights: add a chapter, offer a jump near the start of the video, and
# jump at any time with highlight_key
highlight=yes
highlight_key=H
highlight_prompt_duration=8

# Announce when the whole video is sponsored, self-promotion or exclusive
# access
full_video_labels=yes

# SponsorBlock server, e.g. a mirror or a self-hosted instance
# server_address=https://sponsor.ajay.app

# Local user ID (required for submitting segments)
# This should be a randomly generated 30+ character string stored locally
# NOT the public userID from the stats page
# Optional manual override - leave commented out to auto-generate one
# (recommended). The auto-generated ID is stored in
# ~/.local/state/mpv/yas_user_id, not in this file.
# user_id=
